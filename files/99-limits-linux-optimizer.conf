# /etc/security/limits.d/99-linux-optimizer.conf
#
# Managed by Linux Optimizer — re-running the script overwrites this file.
# Put your own overrides in /etc/security/limits.d/zz-local.conf.
#
# WHY NOT ulimit IN /etc/profile (the old approach):
#   * `ulimit` in /etc/profile only affects login shells. systemd services,
#     docker containers, cron jobs and ssh 'Command' sessions never read it,
#     so the "1048576 file descriptors" you set was silently not applied.
#   * Writing it via `tee -a` on every run appended ~13 lines per execution
#     and eventually grew /etc/profile to thousands of duplicate lines.
#   * pam_limits (this file) is the supported mechanism, and it is where
#     nginx/mariadb/systemd pick their limits up.
#
# Both soft and hard are raised so a service can raise its own soft limit
# later without needing root.
#
# Source: https://github.com/alimc98/linux-optimizer

*    soft    nofile     1048576
*    hard    nofile     1048576
root soft    nofile     1048576
root hard    nofile     1048576

*    soft    nproc      unlimited
*    hard    nproc      unlimited
root soft    nproc      unlimited
root hard    nproc      unlimited

# Locked memory (needed for RDMA, some DPDK/mmap setups, big Redis/Aerospike).
*    soft    memlock    unlimited
*    hard    memlock    unlimited
root soft    memlock    unlimited
root hard    memlock    unlimited

# Core dumps off by default: an unbounded -c on a server fills / with dumps.
# Raise it to 'unlimited' yourself if you actually debug crashes.
*    soft    core       0
*    hard    core       unlimited
