# /etc/sysctl.d/99-linux-optimizer.conf
#
# Managed by Linux Optimizer — re-running the script overwrites this file.
# Put YOUR overrides in /etc/sysctl.d/zz-local.conf (it sorts last) so they
# survive future runs.
#
# Tuned for a general-purpose VPS / small-to-mid dedicated server running
# web + DB workloads on kernel 6.x. Every value below is explained inline.
#
# Source: https://github.com/hawshemi/linux-optimizer

## File system ---------------------------------------------------------------

# Maximum number of open file descriptors the whole system will allocate.
# Note the cap: /proc/sys/fs/nr_open is limited to INT_MAX (2147483647), so
# the previous value of 67108864 was silently clamped and only wasted the
# per-file table preallocation. 2M is plenty and cheap.
fs.file-max = 2097152

# Per-process ceiling for open files (the *real* limit; see also
# /etc/security/limits.d/99-linux-optimizer.conf). Linux >= 4.18.
fs.nr_open = 1048576

## Network core --------------------------------------------------------------

# fq is the pacing discipline BBR needs (BBRv1). Kernels >= 6.x with BBRv2/v3
# do not require fq; keep it, it is harmless and still helps bufferbloat.
net.core.default_qdisc = fq

# Packets queued to the kernel per NIC (rx ring overflow protection).
net.core.netdev_max_backlog = 16384

# Socket-side memory limit.
net.core.somaxconn = 65536

# Maximum listen backlog for sockets that ask for less.
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

net.core.optmem_max = 262144

net.core.rmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_max = 16777216
net.core.wmem_default = 1048576

# Busy-poll: spend up to 50us in softirq on incoming data instead of an
# interrupt round-trip. Low-latency win, ~negligible CPU on a modern core.
net.core.busy_poll = 50
net.core.busy_read = 50

## TCP -----------------------------------------------------------------------

# Per-socket receive / send buffers: min / default / max (bytes).
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# TCP memory pressure thresholds in PAGES (4KiB each) — low / pressure / high.
# The old value (33554432) was read as bytes by almost everyone and effectively
# disabled the limit on small VPSes, letting TCP grow until the OOM killer ran.
# 1.5M pages = 6GiB: high enough to never bind on a normal box, low enough to
# actually protect memory.
net.ipv4.tcp_mem = 786432 1048576 1572864

# Congestion control. BBR ships in every supported kernel. On kernel >= 6.15
# you may prefer 'bbr' (which is BBRv2 there) or an explicit 'bbr3' if the
# XanMod/other build provides it — check:
#   sysctl net.ipv4.tcp_available_congestion_control
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_available_congestion_control = reno cubic bbr

net.ipv4.tcp_max_syn_backlog = 16384

# FIN-WAIT-2 timeout. 60 is the kernel default; the previous 25 only helped
# under SYN-flood-like conditions and cost legitimate slow peers.
net.ipv4.tcp_fin_timeout = 60

# Abandon a stalled connection sooner (default 15 retries ≈ 13–30 minutes).
net.ipv4.tcp_retries2 = 8

# Keepalive: detect a dead peer in ~11 minutes instead of ~2 hours.
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5

net.ipv4.tcp_max_orphans = 262144
net.ipv4.tcp_max_tw_buckets = 262144

# TIME_WAIT reuse for outgoing connections (2 = only for loopback-safe cases).
net.ipv4.tcp_tw_reuse = 2

# Path MTU discovery with probing — required for IPv6 and helps tunnels/VPN.
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_base_mss = 1024

# Start sending once this many bytes are queued (reduces bufferbloat in the
# send path, big win for proxy/reverse-proxy roles).
net.ipv4.tcp_notsent_lowat = 16384

net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_fack = 1

# Do not slow-start again after an idle connection.
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_window_scaling = 1

# ECN: 2 = only when both ends request it (safest), with fallback.
net.ipv4.tcp_ecn = 2
net.ipv4.tcp_ecn_fallback = 1

net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_syn_retries = 5
net.ipv4.tcp_synack_retries = 3

# Automatic buffer tuning off by default is fine; keep explicit.
net.ipv4.tcp_moderate_rcvbuf = 1

## UDP -----------------------------------------------------------------------
net.ipv4.udp_mem = 786432 1048576 1572864
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

## IPv6 ----------------------------------------------------------------------
# IPv6 is left ENABLED. The previous script only had commented lines here;
# disabling IPv6 while interfaces keep static v6 addresses can hang boots and
# break some services, so it stays opt-in:
#net.ipv6.conf.all.disable_ipv6 = 1
#net.ipv6.conf.default.disable_ipv6 = 1
#net.ipv6.conf.lo.disable_ipv6 = 1

# Do not accept router advertisements / redirects on servers that are not
# edge routers, and never accept source-routed v6.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.accept_ra_rt_info_max_plen = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

## Hardening / spoofing ------------------------------------------------------
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_challenge_ack_limit = 999999999

# ARP: use the best source address (multi-IP hosts / bonding).
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.lo.arp_announce = 2

# Neighbour table headroom for large hosts (default 128/256/512 is tiny).
net.ipv4.neigh.default.gc_thresh1 = 4096
net.ipv4.neigh.default.gc_thresh2 = 8192
net.ipv4.neigh.default.gc_thresh3 = 16384
net.ipv6.neigh.default.gc_thresh1 = 4096
net.ipv6.neigh.default.gc_thresh2 = 8192
net.ipv6.neigh.default.gc_thresh3 = 16384
net.ipv4.neigh.default.gc_stale_time = 120

## UNIX domain sockets -------------------------------------------------------
net.unix.max_dgram_qlen = 512

## Virtual memory ------------------------------------------------------------
# Emergency page reserve. 64MB covers up to ~64GB of RAM; larger hosts want
# more (see the kernel docs table).
vm.min_free_kbytes = 65536

# Swap is for emergencies only — a 2GB swapfile on SSD is a safety net, not a
# performance feature. 1 (not 10) avoids the pathological "swap the hot file
# cache, keep the cold pages" behaviour.
vm.swappiness = 1

# Reclaim dentry/inode cache lazily (250 was actively harmful under load).
vm.vfs_cache_pressure = 50

vm.dirty_ratio = 10
vm.dirty_background_ratio = 3
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500

# Strict overcommit (2) is what made PHP/Redis/MariaDB hosts fail fork() while
# memory was still free. Heuristic mode (0) is the correct default.
vm.overcommit_memory = 0
vm.overcommit_ratio = 50

# Redis and similar allocators expect this.
vm.max_map_count = 1048576

## Kernel / scheduling -------------------------------------------------------
# Give kernel threads (kswapd, kcompactd, writeback) headroom over user
# real-time tasks — 950000/100000 leaves 5% for the kernel.
kernel.sched_rt_runtime_us = 950000
kernel.sched_autogroup_enabled = 1

# Reboot 10s after a panic (1 was too fast to read the oops on a remote box).
kernel.panic = 10
kernel.panic_on_oops = 1

# Keep SysRq available for out-of-band debugging.
kernel.sysrq = 1
