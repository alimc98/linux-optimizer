# /etc/ssh/sshd_config.d/99-linux-optimizer.conf
#
# Managed by Linux Optimizer — re-running the script overwrites this file.
# Put your own overrides in /etc/ssh/sshd_config.d/zz-local.conf, or just
# delete this file to undo everything (the main sshd_config was never touched).
#
# WHY A DROP-IN: OpenSSH >= 7.8 reads sshd_config.d/*.conf before the main
# file and the FIRST match wins, so these values always take effect without
# rewriting /etc/ssh/sshd_config — the old script deleted directives from the
# main file and re-appended them, which (a) duplicated lines on every run and
# (b) could destroy a hand-written config.
#
# Source: https://github.com/hawshemi/linux-optimizer

# --- latency / keepalive ---------------------------------------------------
# Don't reverse-resolve connecting clients (this is the single biggest cause
# of a slow SSH banner on VPSes with broken resolvers).
UseDNS no

# Send keepalive packets so NATs drop idle sessions less aggressively.
TCPKeepAlive yes
# Drop a dead session after 3 x 60s = 3 min of silence (was 3000s x 100,
# i.e. effectively never — that is why half-dead sessions hung around).
ClientAliveInterval 60
ClientAliveCountMax 3

# --- tunnels / forwarding --------------------------------------------------
AllowTcpForwarding yes
AllowAgentForwarding yes
GatewayPorts no
PermitTunnel point-to-point
X11Forwarding no

# GatewayPorts yes + PermitTunnel yes on a public box turns your sshd into an
# open relay for other people's connections; X11Forwarding on a headless
# server is only attack surface. Flip them here if you genuinely need them.

# --- crypto ----------------------------------------------------------------
# Modern-only suites. The old line was 'aes256-ctr,chacha20-poly1305@openssh.com'
# which dropped AES-GCM (the fastest on AES-NI hardware) and was incomplete.
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# --- brute force ----------------------------------------------------------------
MaxAuthTries 4
MaxSessions 20
LoginGraceTime 30
# Compression on costs CPU and is a BREACH/CRIME-class risk on high-traffic
# servers; leave it off unless you are on a genuinely slow link.
Compression no
